<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172a49"/><stop offset=".54" stop-color="#0b1017"/><stop offset="1" stop-color="#121825"/></linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4d8deb"/><stop offset="1" stop-color="#806ee8"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="26" stdDeviation="38" flood-opacity=".46"/></filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="82" y="220" fill="#75aaff" font-size="14" font-weight="800" letter-spacing="2">EVERYTHING WITHIN REACH</text>
    <text x="82" y="286" fill="#f5f7fb" font-size="54" font-weight="760">Every control, right</text>
    <text x="82" y="344" fill="#f5f7fb" font-size="54" font-weight="760">from the toolbar.</text>
    <text x="82" y="398" fill="#9aa6b6" font-size="20">Check your live keybind, tune the gesture,</text>
    <text x="82" y="430" fill="#9aa6b6" font-size="20">and shape tab cycling without leaving the page.</text>
    <rect x="82" y="491" width="181" height="46" rx="23" fill="#75aaff" fill-opacity=".12" stroke="#75aaff" stroke-opacity=".25"/>
    <circle cx="107" cy="514" r="6" fill="#67d39b"/><text x="126" y="520" fill="#dce6f3" font-size="14" font-weight="700">Ready on this page</text>

    <g transform="translate(780 55) scale(1.16)" filter="url(#shadow)">
      <rect width="380" height="594" rx="20" fill="#0f141c" stroke="#fff" stroke-opacity=".11"/>
      <line y1="61" x2="380" y2="61" stroke="#fff" stroke-opacity=".09"/>
      <rect x="16" y="14" width="32" height="32" rx="10" fill="url(#mark)"/><text x="32" y="37" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">↕</text>
      <text x="58" y="29" fill="#f5f7fb" font-size="13" font-weight="750">TabWheel</text><text x="58" y="43" fill="#9aa6b6" font-size="9">Scroll Wheel Tab Switcher</text>
      <rect x="332" y="14" width="32" height="32" rx="9" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".09"/><text x="348" y="36" fill="#9aa6b6" text-anchor="middle">⚙</text>

      <rect x="14" y="75" width="352" height="128" rx="16" fill="#171e29" stroke="#75aaff" stroke-opacity=".22"/>
      <circle cx="34" cy="99" r="4" fill="#67d39b"/><text x="46" y="103" fill="#9aa6b6" font-size="10">Ready on this page</text>
      <text x="32" y="139" fill="#f5f7fb" font-size="17" font-weight="760">Alt / Option + wheel down</text>
      <text x="32" y="163" fill="#f5f7fb" font-size="17" font-weight="760">moves through your next tabs.</text>

      <text x="16" y="228" fill="#9aa6b6" font-size="9" font-weight="800" letter-spacing="1">GESTURE</text>
      <rect x="14" y="238" width="352" height="150" rx="13" fill="#171e29" stroke="#fff" stroke-opacity=".09"/>
      <text x="28" y="269" fill="#f5f7fb" font-size="11" font-weight="700">Modifier</text>
      <rect x="236" y="251" width="116" height="34" rx="9" fill="#1d2633" stroke="#fff" stroke-opacity=".09"/><text x="248" y="273" fill="#f5f7fb" font-size="9">Alt / Option ▾</text>
      <line x1="14" y1="294" x2="366" y2="294" stroke="#fff" stroke-opacity=".09"/>
      <text x="28" y="322" fill="#f5f7fb" font-size="11" font-weight="700">Require Shift</text>
      <rect x="314" y="309" width="38" height="20" rx="10" fill="#273140"/><circle cx="325" cy="319" r="8" fill="#dce4ef"/>
      <line x1="14" y1="340" x2="366" y2="340" stroke="#fff" stroke-opacity=".09"/>
      <text x="28" y="368" fill="#f5f7fb" font-size="11" font-weight="700">Modifier + middle click</text>
      <rect x="236" y="350" width="116" height="34" rx="9" fill="#1d2633" stroke="#fff" stroke-opacity=".09"/><text x="248" y="372" fill="#f5f7fb" font-size="9">Open settings ▾</text>

      <text x="16" y="415" fill="#9aa6b6" font-size="9" font-weight="800" letter-spacing="1">TAB CYCLING</text>
      <rect x="14" y="425" width="352" height="99" rx="13" fill="#171e29" stroke="#fff" stroke-opacity=".09"/>
      <text x="28" y="456" fill="#f5f7fb" font-size="11" font-weight="700">Cycle order</text>
      <rect x="225" y="438" width="127" height="34" rx="9" fill="#1d2633" stroke="#fff" stroke-opacity=".09"/><text x="237" y="460" fill="#f5f7fb" font-size="9">Left-To-Right ▾</text>
      <line x1="14" y1="481" x2="366" y2="481" stroke="#fff" stroke-opacity=".09"/>
      <text x="28" y="509" fill="#f5f7fb" font-size="11" font-weight="700">Wheel direction</text>
      <rect x="214" y="491" width="138" height="28" rx="8" fill="#1d2633" stroke="#fff" stroke-opacity=".09"/><text x="226" y="510" fill="#f5f7fb" font-size="9">Down → Next tab ▾</text>

      <rect y="539" width="380" height="55" fill="#0f141c" stroke="#fff" stroke-opacity=".09"/>
      <rect x="14" y="550" width="171" height="33" rx="9" fill="#1d2633" stroke="#fff" stroke-opacity=".09"/><text x="99" y="571" text-anchor="middle" fill="#f5f7fb" font-size="9">Refresh extension</text>
      <rect x="195" y="550" width="171" height="33" rx="9" fill="#ff6666" fill-opacity=".08" stroke="#ff6666" stroke-opacity=".24"/><text x="280" y="571" text-anchor="middle" fill="#f5f7fb" font-size="9">Reset to defaults</text>
      <rect x="371" y="213" width="3" height="176" rx="2" fill="#344156"/>
    </g>
  </g>
</svg>
