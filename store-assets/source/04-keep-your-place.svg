<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112e35"/><stop offset=".5" stop-color="#0c1017"/><stop offset="1" stop-color="#19213a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="34" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="76" y="202" fill="#73d6a0" font-size="14" font-weight="800" letter-spacing="2">WHEEL AND CLICKS, TOGETHER</text>
    <text x="76" y="269" fill="#f4f7fb" font-size="54" font-weight="760">Configure every</text>
    <text x="76" y="327" fill="#f4f7fb" font-size="54" font-weight="760">gesture.</text>
    <text x="76" y="380" fill="#98a4b5" font-size="20">One settings page for the shared modifier,</text>
    <text x="76" y="412" fill="#98a4b5" font-size="20">three mouse actions, and wheel feel.</text>

    <g transform="translate(598 55)" filter="url(#shadow)">
      <rect width="625" height="690" rx="22" fill="#0c1017" stroke="#fff" stroke-opacity=".1"/>
      <text x="30" y="55" fill="#f4f7fb" font-size="24" font-weight="760">Alt / Option + wheel down moves through</text>
      <text x="30" y="84" fill="#f4f7fb" font-size="24" font-weight="760">your next tabs.</text>
      <rect x="30" y="105" width="145" height="35" rx="9" fill="#1a2230" stroke="#fff" stroke-opacity=".09"/><text x="102" y="127" text-anchor="middle" fill="#f4f7fb" font-size="9">Refresh extension</text>
      <rect x="184" y="105" width="145" height="35" rx="9" fill="#ff6666" fill-opacity=".08" stroke="#ff6666" stroke-opacity=".24"/><text x="256" y="127" text-anchor="middle" fill="#f4f7fb" font-size="9">Reset to defaults</text>

      <rect x="28" y="158" width="569" height="286" rx="18" fill="#141a24" stroke="#fff" stroke-opacity=".09"/>
      <circle cx="56" cy="190" r="16" fill="#71a7ff" fill-opacity=".12" stroke="#71a7ff" stroke-opacity=".3"/><text x="56" y="194" fill="#71a7ff" text-anchor="middle" font-size="9" font-weight="800">01</text>
      <text x="82" y="187" fill="#f4f7fb" font-size="15" font-weight="750">Gesture</text><text x="82" y="204" fill="#98a4b5" font-size="9">Choose the shared chord and each mouse-button action.</text>
      <line x1="28" y1="220" x2="597" y2="220" stroke="#fff" stroke-opacity=".09"/>
      <text x="48" y="247" fill="#f4f7fb" font-size="11" font-weight="750">Modifier</text>
      <rect x="433" y="229" width="138" height="30" rx="8" fill="#1a2230" stroke="#fff" stroke-opacity=".09"/><text x="445" y="249" fill="#f4f7fb" font-size="9">Alt / Option ▾</text>
      <line x1="28" y1="266" x2="597" y2="266" stroke="#fff" stroke-opacity=".09"/>
      <text x="48" y="293" fill="#f4f7fb" font-size="11" font-weight="750">Require Shift</text>
      <rect x="527" y="278" width="44" height="24" rx="12" fill="#273140"/><circle cx="539" cy="290" r="9" fill="#dce4ef"/>
      <line x1="28" y1="309" x2="597" y2="309" stroke="#fff" stroke-opacity=".09"/>
      <text x="48" y="336" fill="#f4f7fb" font-size="11" font-weight="750">Modifier + left click</text>
      <rect x="415" y="318" width="156" height="30" rx="8" fill="#1a2230" stroke="#fff" stroke-opacity=".09"/><text x="427" y="338" fill="#f4f7fb" font-size="9">Browser new tab ▾</text>
      <line x1="28" y1="355" x2="597" y2="355" stroke="#fff" stroke-opacity=".09"/>
      <text x="48" y="382" fill="#f4f7fb" font-size="11" font-weight="750">Modifier + middle click</text>
      <rect x="415" y="364" width="156" height="30" rx="8" fill="#1a2230" stroke="#fff" stroke-opacity=".09"/><text x="427" y="384" fill="#f4f7fb" font-size="9">Drag current tab ▾</text>
      <line x1="28" y1="401" x2="597" y2="401" stroke="#fff" stroke-opacity=".09"/>
      <text x="48" y="428" fill="#f4f7fb" font-size="11" font-weight="750">Modifier + right click</text>
      <rect x="415" y="410" width="156" height="30" rx="8" fill="#1a2230" stroke="#fff" stroke-opacity=".09"/><text x="427" y="430" fill="#f4f7fb" font-size="9">Close current tab ▾</text>

      <rect x="28" y="461" width="569" height="185" rx="18" fill="#141a24" stroke="#fff" stroke-opacity=".09"/>
      <circle cx="56" cy="493" r="16" fill="#71a7ff" fill-opacity=".12" stroke="#71a7ff" stroke-opacity=".3"/><text x="56" y="497" fill="#71a7ff" text-anchor="middle" font-size="9" font-weight="800">02</text>
      <text x="82" y="490" fill="#f4f7fb" font-size="15" font-weight="750">Tab Cycling</text><text x="82" y="507" fill="#98a4b5" font-size="9">Tune the wheel feel and participating tabs.</text>
      <line x1="28" y1="523" x2="597" y2="523" stroke="#fff" stroke-opacity=".09"/>
      <text x="48" y="550" fill="#f4f7fb" font-size="11" font-weight="750">Wheel direction</text>
      <rect x="415" y="532" width="156" height="30" rx="8" fill="#1a2230" stroke="#fff" stroke-opacity=".09"/><text x="427" y="552" fill="#f4f7fb" font-size="9">Down → Next tab ▾</text>
      <line x1="28" y1="569" x2="597" y2="569" stroke="#fff" stroke-opacity=".09"/>
      <text x="48" y="596" fill="#f4f7fb" font-size="11" font-weight="750">Preset</text>
      <rect x="433" y="578" width="138" height="30" rx="8" fill="#1a2230" stroke="#fff" stroke-opacity=".09"/><text x="445" y="598" fill="#f4f7fb" font-size="9">Balanced ▾</text>
      <line x1="28" y1="615" x2="597" y2="615" stroke="#fff" stroke-opacity=".09"/>
      <text x="48" y="638" fill="#f4f7fb" font-size="11" font-weight="750">Sensitivity</text><text x="442" y="638" fill="#98a4b5" font-size="9">1.0×</text>
      <line x1="478" y1="635" x2="571" y2="635" stroke="#344156" stroke-width="4" stroke-linecap="round"/><line x1="478" y1="635" x2="522" y2="635" stroke="#71a7ff" stroke-width="4" stroke-linecap="round"/><circle cx="522" cy="635" r="7" fill="#71a7ff"/>
    </g>
  </g>
</svg>
