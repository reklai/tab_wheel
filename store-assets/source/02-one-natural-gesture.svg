<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102e2d"/><stop offset=".5" stop-color="#0b1017"/><stop offset="1" stop-color="#142039"/></linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4d8deb"/><stop offset="1" stop-color="#806ee8"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="26" stdDeviation="34" flood-opacity=".34"/></filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,sans-serif">
    <rect x="90" y="66" width="34" height="34" rx="11" fill="url(#mark)"/><text x="107" y="89" fill="#fff" text-anchor="middle" font-size="19" font-weight="800">↕</text>
    <text x="136" y="88" fill="#98a5b6" font-size="13" font-weight="700">SCROLL WHEEL TAB SWITCHER</text>
    <text x="90" y="188" fill="#68d69c" font-size="14" font-weight="800" letter-spacing="2">MOUSE-ACTION SETUP</text>
    <text x="90" y="252" fill="#f6f8fb" font-size="55" font-weight="760">One modifier. Three actions.</text>
    <text x="90" y="302" fill="#98a5b6" font-size="21">Choose each button, then test it in a safe simulator.</text>
    <g filter="url(#shadow)">
      <rect x="90" y="355" width="1100" height="338" rx="20" fill="#0d131c" stroke="#68d69c" stroke-opacity=".55"/>
      <text x="130" y="404" fill="#98a5b6" font-size="13" font-weight="700">USING ALT / OPTION + MOUSE</text>
      <g>
        <rect x="130" y="438" width="300" height="142" rx="16" fill="#151e29" stroke="#75aaff" stroke-opacity=".28"/>
        <circle cx="170" cy="479" r="20" fill="#75aaff" fill-opacity=".15"/><text x="170" y="485" fill="#75aaff" text-anchor="middle" font-size="16" font-weight="800">L</text>
        <text x="202" y="475" fill="#f6f8fb" font-size="16" font-weight="750">Left click</text>
        <text x="202" y="502" fill="#68d69c" font-size="14" font-weight="700">Browser new tab</text>
        <text x="158" y="548" fill="#98a5b6" font-size="12">Opens beside the current tab.</text>

        <rect x="490" y="438" width="300" height="142" rx="16" fill="#151e29" stroke="#75aaff" stroke-opacity=".28"/>
        <circle cx="530" cy="479" r="20" fill="#75aaff" fill-opacity=".15"/><text x="530" y="484" fill="#75aaff" text-anchor="middle" font-size="14" font-weight="800">●</text>
        <text x="562" y="475" fill="#f6f8fb" font-size="16" font-weight="750">Middle click</text>
        <text x="562" y="502" fill="#68d69c" font-size="14" font-weight="700">Drag current tab</text>
        <text x="518" y="548" fill="#98a5b6" font-size="12">Hold and drag horizontally.</text>

        <rect x="850" y="438" width="300" height="142" rx="16" fill="#151e29" stroke="#75aaff" stroke-opacity=".28"/>
        <circle cx="890" cy="479" r="20" fill="#75aaff" fill-opacity=".15"/><text x="890" y="485" fill="#75aaff" text-anchor="middle" font-size="16" font-weight="800">R</text>
        <text x="922" y="475" fill="#f6f8fb" font-size="16" font-weight="750">Right click</text>
        <text x="922" y="502" fill="#68d69c" font-size="14" font-weight="700">Close current tab</text>
        <text x="878" y="548" fill="#98a5b6" font-size="12">Returns to the recent tab.</text>
      </g>
      <text x="635" y="632" fill="#f6f8fb" text-anchor="middle" font-size="19" font-weight="750">Preview every action without changing real tabs.</text>
      <text x="635" y="660" fill="#98a5b6" text-anchor="middle" font-size="14">Every button can be remapped—or set to Off.</text>
    </g>
    <rect x="970" y="724" width="220" height="48" rx="12" fill="#5f94e8"/><text x="1080" y="755" fill="#07111f" text-anchor="middle" font-size="15" font-weight="800">Continue</text>
  </g>
</svg>
